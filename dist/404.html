<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Abhilash Makode</title>
    <link rel="icon" href="/abhilash-portfolio/profile.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0d0d12;
        color: #ececec;
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .bg-gradient {
        position: fixed;
        inset: 0;
        z-index: -2;
        background:
          radial-gradient(ellipse 80% 50% at 20% 30%, rgba(255, 179, 0, 0.06), transparent),
          radial-gradient(ellipse 70% 50% at 80% 20%, rgba(124, 77, 255, 0.04), transparent),
          #0d0d12;
      }
      .container {
        text-align: center;
        padding: 2rem;
      }
      .code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 8rem;
        font-weight: 800;
        background: linear-gradient(135deg, #ffb300, #7c4dff, #ff5252);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1;
        margin-bottom: 1.5rem;
      }
      h1 {
        font-family: 'Outfit', sans-serif;
        font-size: 2rem;
        font-weight: 600;
        margin-bottom: 0.75rem;
      }
      p {
        color: #9090a0;
        font-size: 1.1rem;
        margin-bottom: 2rem;
        max-width: 400px;
        margin-left: auto;
        margin-right: auto;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.85rem 2rem;
        background: #ffb300;
        color: #0d0d12;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.95rem;
        transition: transform 0.3s ease;
      }
      .btn:hover {
        transform: translateY(-2px);
      }
      .status {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.85rem;
        color: #ff5252;
        margin-top: 2.5rem;
        padding: 0.5rem 1rem;
        border: 1px solid rgba(255, 82, 82, 0.2);
        border-radius: 6px;
        display: inline-block;
        background: rgba(255, 82, 82, 0.06);
      }
    </style>
  </head>
  <body>
    <div class="bg-gradient"></div>
    <div class="container">
      <div class="code">404</div>
      <h1>Page Not Found</h1>
      <p>This route doesn't exist in my cloud infrastructure. Let's route you back home.</p>
      <a href="/abhilash-portfolio/" class="btn">
        <span>←</span>
        <span>Back to Home</span>
      </a>
      <div class="status">HTTP 404 | Resource not found</div>
    </div>
  </body>
</html>
